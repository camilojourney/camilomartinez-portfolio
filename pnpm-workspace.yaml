# Single-package repo: declare the workspace root so pnpm 9 (CI) accepts
# this file — the `packages` field is required whenever pnpm-workspace.yaml
# exists. `allowBuilds` is only understood by pnpm 10+ and is ignored by 9.
packages:
  - '.'
allowBuilds:
  '@vercel/speed-insights': set this to true or false
  bufferutil: set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
