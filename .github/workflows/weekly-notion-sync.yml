# 📂 .github/workflows/weekly-notion-sync.yml
#
# Weekly Automation: Update Whoop data and sync to Notion
# Runs every Sunday at 6:00 AM EST (11:00 AM UTC)
#
# Why GitHub Actions?
# ✅ Free for public/private repos (2000 min/month)
# ✅ No server needed - runs in the cloud
# ✅ Version controlled with your code
# ✅ Secure secrets management
# ✅ Easy monitoring via GitHub UI

name: 📊 Weekly Notion Sync

# Schedule: Every Sunday at 11:00 UTC (6:00 AM EST)
# Cron format: minute hour day-of-month month day-of-week
# Day 0 = Sunday
on:
  schedule:
    - cron: '0 11 * * 0'  # 11:00 UTC Sunday = 6:00 AM EST

  # Allow manual trigger from GitHub Actions UI for testing
  workflow_dispatch:

jobs:
  sync-weekly-data:
    name: Update Whoop → Notion
    runs-on: ubuntu-latest

    # Set working directory for all steps
    defaults:
      run:
        working-directory: ./backend

    steps:
      # Step 1: Checkout the repository code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      # Why Python 3.11? Matches your development environment
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install UV package manager
      # Why UV? It's what you use locally - faster than pip
      - name: 📦 Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Step 4: Install Python dependencies
      # Uses your pyproject.toml for exact same packages as local
      - name: 📚 Install dependencies
        run: |
          uv sync

      # Step 5: Update Whoop weekly habits table
      # This calculates LAST week's data (the week that just ended) and stores in database
      - name: 🏃 Update Whoop weekly habits
        env:
          # Only needs database connection
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📊 Calculating LAST week's habits data (week that just ended)..."
          uv run python scripts/populate_weekly_habits.py --show --limit 3

      # Step 6: Update EXISTING Notion pages for last week with Whoop data
      # These pages should already exist (created the previous Sunday)
      - name: 📝 Update Notion pages with Whoop data
        env:
          # Database and Notion credentials
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "📤 Updating existing Notion pages with last week's data..."
          uv run python scripts/sync_weekly_to_notion.py

      # Step 7: Create new empty template pages for the upcoming week
      # Duplicates the previous week's pages (with Goals, Systems, Constraints)
      # but clears the Hours/Count fields for new data
      - name: 📋 Create template pages for new week
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          echo "📋 Creating template pages for the new week..."
          uv run python scripts/duplicate_weekly_pages.py

      # Step 9: Report success
      - name: ✅ Summary
        if: success()
        run: |
          echo "🎉 Weekly sync completed successfully!"
          echo "✓ Whoop data updated in database"
          echo "✓ Last week's Notion pages updated with data"
          echo "✓ New week's template pages created"
          echo "📅 Check your Notion for this week's review"

      # Step 11: Report failure
      - name: ❌ Failure notification
        if: failure()
        run: |
          echo "⚠️  Weekly sync failed!"
          echo "Check the logs above for details"
          exit 1
