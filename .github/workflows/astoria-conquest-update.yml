name: Astoria Conquest Weekly Update

on:
  schedule:
    # Run every Monday at 10:00 PM UTC (22:00)
    - cron: '0 22 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI
    inputs:
      skip_db:
        description: 'Skip database-dependent steps (update progress & correlation). Useful for testing without a DB.'
        required: false
        default: 'false'
      commit_changes:
        description: 'If true, commit and push generated files back to the repository. Default false for safe manual testing.'
        required: false
        default: 'false'

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libspatialindex-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        working-directory: backend
        run: |
          uv sync --frozen

      - name: Validate secrets and inputs
        shell: bash
        run: |
          # Allow skipping DB-heavy steps for testing
          if [ "${{ github.event.inputs.skip_db }}" == "true" ]; then
            echo "Skipping DB-dependent steps by request (workflow input skip_db=true)."
            echo "skip_db=true" >> "$GITHUB_OUTPUT"
          else
            # Fail early with a clear message if DATABASE_URL isn't present
            if [ -z "${{ secrets.DATABASE_URL }}" ]; then
              echo "🚨 ERROR: DATABASE_URL secret is not set."
              echo "Set the secret in the repo settings or use skip_db=true for testing."
              exit 1
            fi
            echo "skip_db=false" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Run Astoria progress update
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NONPRISMA: ${{ secrets.DATABASE_URL }}
        if: ${{ github.event.inputs.skip_db != 'true' }}
        run: |
          uv run python app/scripts/astoria/update_progress.py

      - name: Run activity correlation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NONPRISMA: ${{ secrets.DATABASE_URL }}
        if: ${{ github.event.inputs.skip_db != 'true' }}
        run: |
          uv run python app/scripts/correlate_activities.py
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only push if commit_changes input was provided and true
          if [[ "${{ github.event.inputs.commit_changes }}" == "true" ]]; then
            if [[ -n $(git status --porcelain) ]]; then
              git add public/data/astoria-conquest/
              git commit -m "chore: update Astoria Conquest map data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              
              # Push with retry - pull and retry if rejected
              echo "📤 Pushing changes..."
              for attempt in 1 2 3; do
                if git push origin main; then
                  echo "✅ Successfully pushed updated map data"
                  break
                else
                  echo "⚠️ Push failed (attempt $attempt/3). Pulling and retrying..."
                  git pull --rebase origin main || git pull --no-rebase origin main
                  if [ $attempt -eq 3 ]; then
                    echo "❌ Failed to push after 3 attempts"
                    exit 1
                  fi
                fi
              done
            else
              echo "ℹ️ No changes to commit"
            fi
          else
            # Helpful output for tests: list changed files without committing
            echo "ℹ️ Skipping commit because 'commit_changes' input is not 'true'."
            echo "Changed files (if any):"
            git --no-pager status --porcelain || true
            git --no-pager diff --name-only || true
          fi
