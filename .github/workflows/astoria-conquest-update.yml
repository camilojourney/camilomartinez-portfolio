name: Astoria Conquest Weekly Update

on:
  schedule:
    # Run every Saturday at 1:00 AM UTC (same as your Render cron)
    - cron: '0 22 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  update-map:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libspatialindex-dev
          
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Install Python dependencies
        working-directory: backend
        run: |
          poetry install --no-interaction --no-root
          
      - name: Run Astoria progress update
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NONPRISMA: ${{ secrets.DATABASE_URL }}
        run: |
          poetry run python app/scripts/astoria/update_progress.py
          
      - name: Run activity correlation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NONPRISMA: ${{ secrets.DATABASE_URL }}
        run: |
          poetry run python app/scripts/correlate_activities.py
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            git add public/data/astoria-conquest/
            git commit -m "chore: update Astoria Conquest map data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "✅ Successfully pushed updated map data"
          else
            echo "ℹ️ No changes to commit"
          fi
