name: Cron - Daily Data Fetch

on:
  schedule:
    # 19:00 UTC daily (matches previous Vercel cron schedule)
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: cron-daily-data-fetch
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily WHOOP fetch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET GitHub Actions secret."
            exit 1
          fi

          curl -fsS -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 600 \
            "https://camilomartinez.co/api/cron/daily-data-fetch"

