product:
  name: "Camilo Martinez Portfolio"
  tagline: "AI Engineer & Full-Stack Developer"
  audience: "Recruiters, hiring managers, potential clients, tech community"
  type: "Personal portfolio / developer showcase"
  url: "https://camilomartinez.co"

server:
  base_url: "http://localhost:3005"
  start_command: "pnpm dev"
  type: "nextjs"

screenshots:
  output_dir: "e2e/screenshots/audit"
  viewports:
    desktop: { width: 1440, height: 900 }
    mobile: { width: 375, height: 812 }

routes:
