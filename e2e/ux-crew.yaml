    - { path: "/projects/social-media-pipeline", name: "project-social-media" }
    - { path: "/projects/rag-system", name: "project-rag" }
    - { path: "/projects/focus-time", name: "project-focus-time" }
    - { path: "/projects/accountability-partner", name: "project-accountability" }
    - { path: "/apps", name: "apps" }
    - { path: "/apps/trading-bot", name: "app-trading-bot" }
    - { path: "/apps/fitness-dashboard", name: "app-fitness" }
    - { path: "/apps/focus-time", name: "app-focus-time" }
    - { path: "/apps/social-media-pipeline", name: "app-social-media" }
    - { path: "/blog", name: "blog" }
    - { path: "/bookshelf", name: "bookshelf" }
    - { path: "/contact", name: "contact" }
    - { path: "/live-data", name: "live-data" }
    - { path: "/tools", name: "tools" }
