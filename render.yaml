services:
  # Uber NYC Dashboard — Plotly Dash app
  # Deployed at uber.camilomartinez.co
  - type: web
    name: uber-nyc-dashboard
    runtime: python
    region: oregon
    plan: free
    rootDir: dashboards/uber-nyc
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

  # Astoria Conquest Weekly Update (Cron Job)
  # Runs every Monday at 1:30 PM to:
  # 1. Update progress map with new Strava runs (GPS matching)
  # 2. Correlate any new Strava/WHOOP activities
  # 3. Auto-commit and push updated files to trigger Vercel deploy
  # Note: Base map generation skipped (files already in repo)
  - type: cron
    name: astoria-weekly-update
    runtime: python
    region: oregon
    plan: free
    schedule: "30 13 * * 1"  # Every Monday at 1:30 PM
    buildCommand: "cd backend && rm -rf .venv && pip install --no-cache-dir poetry && poetry install --no-root"
    startCommand: "bash backend/app/scripts/astoria/render_cron_wrapper.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: POSTGRES_URL_NONPRISMA
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEPLOY_KEY
        sync: false
