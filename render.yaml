services:
  # Python Background Worker for Astoria Conquest Updates
  - type: web
    name: astoria-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install poetry && poetry install --no-root"
    startCommand: "cd backend && poetry run gunicorn app.api.worker_webhook:app --bind 0.0.0.0:$PORT --timeout 300"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: POSTGRES_URL_NONPRISMA
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WORKER_WEBHOOK_SECRET
        generateValue: true
    healthCheckPath: /health

  # Optional: Cron job service (alternative to Vercel cron)
  - type: cron
    name: astoria-weekly-update
    runtime: python
    region: oregon
    plan: free
    schedule: "30 13 * * 1"  # Every Monday at 1:30 PM
    buildCommand: "cd backend && pip install poetry && poetry install --no-root"
    startCommand: "cd backend && poetry run python app/scripts/astoria/update_progress.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: POSTGRES_URL_NONPRISMA
        sync: false
      - key: DATABASE_URL
        sync: false
