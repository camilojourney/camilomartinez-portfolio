services:
  # Astoria Conquest Weekly Update (Cron Job)
  # Runs every Monday at 1:30 PM to:
  # 1. Fetch Strava runs from PostgreSQL
  # 2. Match with WHOOP data
  # 3. Generate updated map GeoJSON files
  - type: cron
    name: astoria-weekly-update
    runtime: python
    region: oregon
    plan: free
    schedule: "30 13 * * 1"  # Every Monday at 1:30 PM
    buildCommand: "cd backend && pip install poetry && poetry install --no-root"
    startCommand: "cd backend && poetry run python app/scripts/astoria/update_progress.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: POSTGRES_URL_NONPRISMA
        sync: false
      - key: DATABASE_URL
        sync: false
